<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010205">
  <title>Hudba · SYNTHOMA</title>
  <meta name="description" content="Hudba ze SYNTHOMY. Stačí poslouchat.">
  <meta property="og:title" content="Hudba · SYNTHOMA">
  <meta property="og:description" content="Hudba ze SYNTHOMY. Stačí poslouchat.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/hudba.css?v=4">
</head>
<body>
<main>
  <header><a class="brand" href="/" aria-label="SYNTHOMA — hlavní stránka"><span class="wordmark">SYNTHOMA</span><span class="home-label">← Hlavní stránka</span></a><span class="label">Hudba / 01</span></header>
  <div class="layout">
    <section class="player" aria-label="Přehrávač">
      <div class="art" aria-hidden="true"><span class="art-index" id="art-index">—</span><span class="art-tag">SYNTHOMA · AUDIO</span></div>
      <div class="status" id="status" role="status">Načítání skladeb…</div>
      <h2 id="current-title">Hudba</h2>
      <audio id="audio" controls playsinline preload="none" controlslist="nodownload" aria-label="Přehrávač hudby"></audio>
      <div class="transport"><button id="previous" type="button" disabled>← Předchozí</button><button id="next" type="button" disabled>Další →</button><button id="retry" type="button" hidden>Zkusit znovu</button></div>
      <p id="error" class="error" role="alert" hidden></p>
      <noscript><p>Pro načtení skladeb zapněte JavaScript v prohlížeči.</p></noscript>
    </section>
    <section aria-labelledby="collection-title">
      <div class="collection-head"><h1 id="collection-title">Stačí poslouchat.</h1><p id="track-count">Načítání…</p></div>
      <p class="order-hint" id="order-help">Pořadí změníš přetažením za ⠿. Na klávesnici použij šipky ↑ a ↓.</p>
      <p class="sr-only" id="order-status" role="status"></p>
      <ol id="tracks" aria-label="Seznam skladeb"></ol>
    </section>
  </div>
  <footer><span>SYNTHOMA / HUDBA</span><span>POZORNOST NENÍ VLASTNICTVÍ.</span></footer>
</main>
<script>
(() => {
  'use strict';
  let tracks = [];
  let buttons = [];
  const audio = document.getElementById('audio');
  const list = document.getElementById('tracks');
  const title = document.getElementById('current-title');
  const status = document.getElementById('status');
  const error = document.getElementById('error');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const retry = document.getElementById('retry');
  let current = -1;
  let request = 0;
  const orderKey = 'synthoma.music.order.v1';
  let drag = null;
  function restoreOrder(catalog) {
    try {
      const saved = JSON.parse(localStorage.getItem(orderKey));
      if (!Array.isArray(saved)) return catalog;
      const remaining = new Map(catalog.map(track => [track.url, track]));
      const ordered = [];
      saved.forEach(url => { if (remaining.has(url)) { ordered.push(remaining.get(url)); remaining.delete(url); } });
      return [...ordered, ...remaining.values()];
    } catch { return catalog; }
  }
  function moveTrack(from, to) {
    if (from === to || to < 0 || to >= tracks.length) return;
    const playingUrl = tracks[current]?.url;
    const [moved] = tracks.splice(from, 1);
    tracks.splice(to, 0, moved);
    current = tracks.findIndex(track => track.url === playingUrl);
    let saved = true;
    try { localStorage.setItem(orderKey, JSON.stringify(tracks.map(track => track.url))); } catch { saved = false; }
    renderTracks();
    update();
    list.children[to].querySelector('.drag-handle').focus({preventScroll: true});
    document.getElementById('order-status').textContent = moved.title + ': pozice ' + (to + 1) + ' z ' + tracks.length + (saved ? '.' : '. Pořadí platí pouze do zavření stránky; prohlížeč nepovolil uložení.');
  }
  function markDrop() {
    if (!drag || !drag.started) return;
    const rows = [...list.children];
    rows.forEach(row => row.classList.remove('drop-before', 'drop-after'));
    const others = rows.filter(row => row !== drag.row);
    drag.to = others.filter(row => {const box = row.getBoundingClientRect(); return drag.y > box.top + box.height / 2;}).length;
    if (drag.to < others.length) others[drag.to].classList.add('drop-before');
    else others.at(-1)?.classList.add('drop-after');
    drag.row.style.transform = 'translateY(' + (drag.y - drag.startY + window.scrollY - drag.scrollY) + 'px)';
  }
  function scrollDrag() {
    if (!drag) return;
    if (drag.started) {
      const edge = 72;
      const speed = drag.y < edge ? -Math.min(12, (edge - drag.y) / 4) : drag.y > innerHeight - edge ? Math.min(12, (drag.y - innerHeight + edge) / 4) : 0;
      if (speed) window.scrollBy(0, speed);
      markDrop();
    }
    drag.frame = requestAnimationFrame(scrollDrag);
  }
  function finishDrag(commit) {
    if (!drag) return;
    const finished = drag;
    drag = null;
    cancelAnimationFrame(finished.frame);
    finished.row.style.transform = '';
    finished.row.classList.remove('dragging');
    list.classList.remove('is-dragging');
    [...list.children].forEach(row => row.classList.remove('drop-before', 'drop-after'));
    if (finished.handle.hasPointerCapture(finished.pointerId)) finished.handle.releasePointerCapture(finished.pointerId);
    if (commit && finished.started) moveTrack(finished.from, finished.to);
  }
  document.addEventListener('keydown', event => {if (event.key === 'Escape' && drag) {event.preventDefault(); finishDrag(false);}});
  window.addEventListener('blur', () => finishDrag(false));
  document.addEventListener('visibilitychange', () => {if (document.hidden) finishDrag(false);});
  function renderTracks() {
  list.replaceChildren();
  buttons = tracks.map((track, index) => {
    const li = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'track';
    const number = document.createElement('span');
    number.className = 'number';
    number.textContent = String(index + 1).padStart(2, '0');
    const text = document.createElement('span');
    text.className = 'track-name';
    text.textContent = track.title;
    const symbol = document.createElement('span');
    symbol.className = 'symbol';
    symbol.setAttribute('aria-hidden', 'true');
    button.append(number, text, symbol);
    button.addEventListener('click', () => {
      if (index === current && !audio.paused) audio.pause();
      else select(index);
    });
    li.append(button);
    const handle = document.createElement('button');
    handle.type = 'button';
    handle.className = 'drag-handle';
    handle.textContent = '⠿';
    handle.setAttribute('aria-label', 'Změnit pořadí: ' + track.title);
    handle.setAttribute('aria-describedby', 'order-help');
    handle.addEventListener('keydown', event => {
      if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
      event.preventDefault();
      if (!drag) moveTrack(index, index + (event.key === 'ArrowUp' ? -1 : 1));
    });
    handle.addEventListener('pointerdown', event => {
      if (drag || !event.isPrimary || event.button !== 0 || tracks.length < 2) return;
      handle.setPointerCapture(event.pointerId);
      drag = {handle, row: li, from: index, to: index, pointerId: event.pointerId, startY: event.clientY, y: event.clientY, scrollY: window.scrollY, started: false, frame: 0};
      drag.frame = requestAnimationFrame(scrollDrag);
    });
    handle.addEventListener('pointermove', event => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      drag.y = event.clientY;
      if (!drag.started && Math.abs(drag.y - drag.startY) > 6) {
        drag.started = true;
        li.classList.add('dragging');
        list.classList.add('is-dragging');
      }
      markDrop();
    });
    handle.addEventListener('pointerup', event => {if (drag?.pointerId === event.pointerId) finishDrag(true);});
    handle.addEventListener('pointercancel', () => finishDrag(false));
    handle.addEventListener('lostpointercapture', () => finishDrag(false));
    li.append(handle);
    list.append(li);
    return button;
  });
  }
  function update() {
    buttons.forEach((button, index) => {
      const playing = current === index && !audio.paused;
      button.setAttribute('aria-current', String(current === index));
      button.setAttribute('aria-label', (playing ? 'Pozastavit: ' : 'Přehrát: ') + tracks[index].title);
      button.lastElementChild.textContent = playing ? 'Ⅱ' : '▷';
    });
    previous.disabled = current <= 0;
    next.disabled = current < 0 || current >= tracks.length - 1;
    if (current >= 0) document.getElementById('art-index').textContent = String(current + 1).padStart(2, '0') + ' / ' + tracks.length;
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
  }
  function metadata() {
    if ('mediaSession' in navigator && 'MediaMetadata' in window) {
      navigator.mediaSession.metadata = new MediaMetadata({title: tracks[current].title, artist: 'SYNTHOMA', artwork: [{src: '/assets/icon_512.png', sizes: '512x512', type: 'image/png'}]});
    }
  }
  function loadTrack(index) {
    current = index;
    audio.src = tracks[current].url;
    title.textContent = tracks[current].title;
    document.getElementById('art-index').textContent = String(current + 1).padStart(2, '0') + ' / ' + tracks.length;
    audio.setAttribute('aria-label', 'Přehrát ' + tracks[current].title);
    metadata();
  }
  async function select(index) {
    if (index < 0 || index >= tracks.length) return;
    const token = ++request;
    error.hidden = true;
    if (index !== current || audio.error) {
      loadTrack(index);
    }
    status.textContent = 'Načítání…';
    update();
    try { await audio.play(); }
    catch (cause) {
      if (token !== request || cause.name === 'AbortError') return;
      status.textContent = 'Přehrávání pozastaveno';
      error.textContent = cause.name === 'NotAllowedError' ? 'Pro pokračování stiskněte přehrávání přímo v přehrávači.' : 'Skladbu se nepodařilo přehrát. Zkuste ji vybrat znovu nebo přejděte na další.';
      error.hidden = false;
    }
  }
  previous.addEventListener('click', () => select(current - 1));
  next.addEventListener('click', () => select(current + 1));
  audio.addEventListener('playing', () => {status.textContent = 'Právě hraje'; error.hidden = true; update();});
  audio.addEventListener('pause', () => {status.textContent = 'Pozastaveno'; update();});
  audio.addEventListener('waiting', () => {status.textContent = 'Načítání…';});
  audio.addEventListener('error', () => {status.textContent = 'Skladba není dostupná'; error.textContent = 'Skladbu se nepodařilo načíst. Zkuste ji vybrat znovu nebo přejděte na další.'; error.hidden = false; update();});
  audio.addEventListener('ended', () => {
    if (current < tracks.length - 1) select(current + 1);
    else {status.textContent = 'Dohráno'; update();}
  });
  if ('mediaSession' in navigator) {
    const seek = (time) => {
      if (Number.isFinite(audio.duration)) audio.currentTime = Math.max(0, Math.min(time, audio.duration));
    };
    const handlers = {
      play: () => select(current), pause: () => audio.pause(),
      previoustrack: () => select(current - 1), nexttrack: () => select(current + 1),
      seekto: (event) => seek(event.seekTime),
      seekbackward: (event) => seek(audio.currentTime - (event.seekOffset || 10)),
      seekforward: (event) => seek(audio.currentTime + (event.seekOffset || 10)),
    };
    Object.entries(handlers).forEach(([action, handler]) => {try {navigator.mediaSession.setActionHandler(action, handler);} catch { /* Unsupported platform action. */ }});
    const updatePosition = () => {
      if (!navigator.mediaSession.setPositionState || !Number.isFinite(audio.duration) || audio.duration <= 0) return;
      try { navigator.mediaSession.setPositionState({duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration)}); } catch { /* Older media session implementation. */ }
    };
    ['loadedmetadata', 'timeupdate', 'seeked', 'ratechange'].forEach(event => audio.addEventListener(event, updatePosition));
  }
  async function loadCatalog() {
    retry.hidden = true;
    error.hidden = true;
    status.textContent = 'Načítání skladeb…';
    try {
      const response = await fetch('/api/hudba', {cache: 'no-store'});
      if (!response.ok) throw new Error('Catalog unavailable');
      const data = await response.json();
      if (!Array.isArray(data) || !data.every(track => typeof track.title === 'string' && typeof track.url === 'string' && track.url.startsWith('/hudba/'))) throw new Error('Invalid catalog');
      tracks = restoreOrder(data);
      renderTracks();
      const count = tracks.length;
      document.getElementById('track-count').textContent = count + (count === 1 ? ' skladba' : count >= 2 && count <= 4 ? ' skladby' : ' skladeb');
      if (count) {
        loadTrack(0);
        status.textContent = 'Připraveno k poslechu';
      } else {
        status.textContent = 'Zatím tu nejsou žádné skladby';
      }
      update();
    } catch {
      status.textContent = 'Seznam není dostupný';
      document.getElementById('track-count').textContent = 'Skladby se nepodařilo načíst';
      error.textContent = 'Zkontrolujte připojení a zkuste načíst skladby znovu.';
      error.hidden = false;
      retry.hidden = false;
    }
  }
  retry.addEventListener('click', loadCatalog);
  loadCatalog();
})();
</script>
</body>
</html>
