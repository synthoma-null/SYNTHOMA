name: Application checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synthoma
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: synthoma_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://synthoma:test-only-password@localhost:5432/synthoma_test_ci
      DIRECT_URL: postgresql://synthoma:test-only-password@localhost:5432/synthoma_test_ci
      SYNTHOMA_POSTGRES_TEST_URL: postgresql://synthoma:test-only-password@localhost:5432/synthoma_test_ci
      AUTH_SECRET: ci-only-secret-not-for-deployment-123456789
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pwa:audit
      - run: npm test -- --runInBand --no-coverage
      - name: Publication HTTP integration
        run: |
          npm start > /tmp/synthoma-http.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://localhost:3000/ > /dev/null && break; sleep 1; done
          SYNTHOMA_HTTP_TEST_ORIGIN=http://localhost:3000 npm test -- --runInBand --no-coverage --testPathPatterns=publication.http
